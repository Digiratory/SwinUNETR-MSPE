[build-system]
requires = [
    "setuptools>=64.0.0",
    "wheel",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "SwinUNETR_MSPE"
dynamic = ["version"]
authors = [
  {name = "Aleksandr Sinitca", email = "amsinitca@etu.ru"},
]
maintainers = [
  {name = "Aleksandr Sinitca", email = "amsinitca@etu.ru"}
]
description = ""
readme = "README.md"
license = "Apache-2.0"
dependencies = [

]

[project.urls]
Repository = "https://github.com/Digiratory/SwinUNETR-MSPE"
Issues = "https://github.com/Digiratory/SwinUNETR-MSPE/issues"

[tool.setuptools_scm]
version_file = "SwinUNETR_MSPE/_version.py"
tag_regex = "^release/(.+?)(?:-.+)?$"
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"
